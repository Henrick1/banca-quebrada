name: Instalador Windows

on:
  push:
    branches: [main]
    paths: ['src/**', 'electron/**', 'build.mjs', 'package.json', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - id: versao
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Banca Quebrada ${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
